name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test ((${{ matrix.os }}))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Code Formatting Check (Linux Only)
        if: runner.os == 'Linux'
        run: |
            if [ -n "$(gofmt -s -l .)" ]; then
              echo "The following files require gofmt -s -w:"
              gofmt -s -l .
              exit 1
            fi
      - name: Go Vet
        run: go vet ./...
      - name: Run Tests (-race)
        run: go test -v -race -count=1 ./...
      - name: Build Binary
        run: go build -v ./cmd/caduceus
